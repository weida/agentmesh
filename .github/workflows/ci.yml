name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root + backend + registry)
        run: npm run install:all

      - name: Run all test suites
        run: npm run test:all

  redis-store:
    name: RedisStore Integration
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps + redis client
        run: |
          npm --prefix backend install
          npm --prefix backend install redis@^4.7.0

      - name: Run RedisStore contract against live Redis
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
        run: node --test backend/redis-store.test.mjs

  check-deps:
    name: Dependency Resolution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install savantdex deps
        run: npm install

      - name: Verify sdk imports resolve
        run: |
          node -e "import('./sdk/registry.mjs').then(() => console.log('sdk/registry.mjs OK')).catch(e => { console.error('FAIL:', e.message); process.exit(1) })"
          node -e "import('./sdk/canonical.mjs').then(() => console.log('sdk/canonical.mjs OK')).catch(e => { console.error('FAIL:', e.message); process.exit(1) })"
          node -e "import('./sdk/attestation.mjs').then(() => console.log('sdk/attestation.mjs OK')).catch(e => { console.error('FAIL:', e.message); process.exit(1) })"
          node -e "import('./sdk/relay-agent.mjs').then(() => console.log('sdk/relay-agent.mjs OK')).catch(e => { console.error('FAIL:', e.message); process.exit(1) })"
